command_timeout = 1000

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
$username\
$directory\
${custom.giturl}\
$git_branch\
$git_state\
$git_status\
$line_break\
$character
"""

right_format = """$all"""

palette = "tokyonight_night"

[palettes.tokyonight_night]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"
teal = "#1abc9c"
orange = "#ff9e64"
purple = "#9d7cd8"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = " "
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
style_user="teal"
style_root="red"
format = "[ $user ]($style)"
show_always=true
disabled=false

[directory]
style = "blue"
format = "in[ $path ]($style)"
#truncation_length = 4
#truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[os]
disabled = true

[custom.giturl]
description = "Display symbol for remote Git server"
command = """
GIT_REMOTE=$(command git ls-remote --get-url 2> /dev/null)
if [[ "$GIT_REMOTE" =~ "github" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "gitlab" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "bitbucket" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "git" ]]; then
    GIT_REMOTE_SYMBOL=" "
else
    GIT_REMOTE_SYMBOL=" "
fi
echo "$GIT_REMOTE_SYMBOL "
"""
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
format = "at $output"

[git_branch]
symbol = "[](black) "
style = "fg:magenta bg:black"
format =  '  on [$symbol$branch]($style)[](black) '

[aws]
disabled = true

[cmd_duration]
min_time = 4
show_milliseconds = true
disabled = false
style = "italic red"

[git_status]
format = '[($all_status$ahead_behind) ]($style)'
stashed = "[${count}*](green)" 
modified = "[${count}+](yellow)" 
deleted =  "[${count}-](red)" 
conflicted =  "[${count}~](red)" 
ahead = "⇡${count}"
behind = "⇣${count}"
untracked = "[${count}?](blue)" 
staged = "[${count}+](green)" 

[git_state]
style =	"bold red"
format = "[$state($progress_current/$progress_total) ]($style)"
rebase = "rebase"
merge = "merge"	
revert = "revert"	
cherry_pick = "cherry"
bisect = "bisect"	
am = "am"	
am_or_rebase = "am/rebase"

[time]
disabled = false
time_format = "%R"
format = '[[ $time](fg:orange)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = " [➜](bold green)"
error_symbol = " [✗](italic red)"
vimcmd_symbol = ' [](bold fg:green)'
vimcmd_replace_one_symbol = ' [](bold fg:purple)'
vimcmd_replace_symbol = ' [](bold fg:purple)'
vimcmd_visual_symbol = ' [](bold fg:magenta)'
