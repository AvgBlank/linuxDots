# Disable first-run setup
onboarding = false

[ui]
# Show agent states using symbols
status_indicators = "symbols"

# Hide the sidebar completely when collapsed
sidebar_collapsed_mode = "hidden"

# Enable mouse mode and copy selected text automatically
mouse_capture = true
copy_on_select = true

# Disable confirmation when closing workspaces
confirm_close = false

# Create tabs without asking for a name
prompt_new_tab_name = false

# Show the tab bar at the bottom
tab_bar_position = "bottom"

# Show workspace number and name, time, and date on the right
# The Python helper also updates tab names from their running processes
tab_bar_right = [
  { type = "command", command = 'python3 "$HOME/.config/herdr/helpers/herdr.py" status', interval_seconds = 1, timeout_seconds = 2 },
  { type = "datetime", format = "%H:%M %d-%b-%y" },
]
tab_bar_right_separator = " | "

[ui.sound]
# Enable notification sounds
enabled = true

[theme]
# Use the terminal's colours without automatic theme switching
name = "terminal"
auto_switch = false

[theme.custom]
# Use Mocha Mantle for the bar and Surface 0 for inactive tabs
# These shared colours also apply to other Herdr controls
panel_bg = "#181825"
surface0 = "#313244"

# Use Overlay 2 for separators and Lavender for status text
overlay0 = "#9399b2"
overlay1 = "#b4befe"

# Highlight the active tab in Mauve with dark text
accent = "#cba6f7"

[ui.toast]
# Send notifications through the operating system
delivery = "system"

[terminal]
# Use zsh for new panes
default_shell = "zsh"

# Open new panes and tabs in the current pane's directory
new_cwd = "follow"

# Enable image rendering for yazi
kitty_graphics = true

[keys]
# Change prefix from Ctrl + b to Ctrl + a
prefix = "ctrl+a"

# Bind Prefix + d to detach without stopping the session
detach = "prefix+d"

# Bind Prefix + p to toggle the sidebar
toggle_sidebar = "prefix+p"

# Reload Herdr config using Prefix + r
reload_config = "prefix+r"

# Bind Prefix + Shift + r to resize panes
resize_mode = "prefix+shift+r"

# Bind Prefix + s to native Go To instead of sidebar navigation
workspace_picker = ""
goto = "prefix+s"

# Bind Prefix + ( and ) to cycle through open workspaces
previous_workspace = "prefix+("
next_workspace = "prefix+)"

# Bind Prefix + - and = to cycle through open agents
previous_agent = "prefix+-"
next_agent = "prefix+="

# Bind Prefix + Alt + Shift + 1–9 to focus agents in their current panel order
focus_agent = "prefix+alt+shift+1..9"

# Bind Prefix + g to open an existing Git worktree
open_worktree = "prefix+g"

# Bind Prefix + Shift + g to create a Git worktree
new_worktree = "prefix+shift+g"

# Bind Prefix + Shift + x to delete a worktree checkout after confirmation
# The Git branch is kept; Prefix + q only closes the workspace
remove_worktree = "prefix+shift+x"

# Use Ctrl + h, j, k, l for pane movement in sidebar navigation
# These bindings do not change movement inside native Go To
navigate_pane_up = "ctrl+k"
navigate_pane_down = "ctrl+j"
navigate_pane_left = "ctrl+h"
navigate_pane_right = "ctrl+l"

# Bind Prefix + $ and Prefix + comma to rename workspaces and tabs
rename_workspace = "prefix+$"
rename_tab = "prefix+comma"

# Bind Prefix + Left/Right to switch tabs
next_tab = ["prefix+n", "prefix+right"]
previous_tab = "prefix+left"

# Use helper commands below for persistent tab slots
move_tab_previous = ""
move_tab_next = ""
new_tab = ""

# Disable positional selection; helper commands select slots 1–9
switch_tab = ""

# Bind Prefix + & to close the current tab
close_tab = "prefix+ampersand"

# Bind Prefix + % and double quote to split panes right and down
split_vertical = "prefix+%"
split_horizontal = 'prefix+"'

# Bind Prefix + q to close the current workspace
close_workspace = "prefix+q"

# Bind Prefix + z to zoom the current pane
zoom = "prefix+z"

# Bind Prefix + ^ and semicolon to return to the previous pane
last_pane = ["prefix+^", "prefix+semicolon"]

# Bind Ctrl + f to open herdrthing (project picker)
# The temporary pane closes after selection or cancellation
[[keys.command]]
key = "ctrl+f"
type = "pane"
command = "zsh -c 'source \"$HOME/.config/zsh/funcs.zsh\"; herdrthing'"
description = "pick project directory"

# Bind Prefix + Alt + g to open lazygit in a full-size native popup
[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = 'sh "$HOME/.config/herdr/helpers/lazygit.sh"'
description = "open lazygit"

# Smart pane switching with awareness of Vim splits
# Bind Ctrl + h/l to move between panes or pass through to Vim/Neovim/fzf
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = 'python3 "$HOME/.config/herdr/helpers/herdr.py" navigate left ctrl+h'
description = "focus left split or pane"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = 'python3 "$HOME/.config/herdr/helpers/herdr.py" navigate right ctrl+l'
description = "focus right split or pane"

