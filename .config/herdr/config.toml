# Bind Alt + u to return to the repository's primary checkout
[[keys.command]]
key = "alt+u"
type = "shell"
command = 'python3 "$HOME/.config/herdr/helpers/herdr_worktrees.py" root'
description = "focus root repository"

# Bind Alt + i/o/p to persistent worktree slots 1/2/3
# Empty slots offer existing checkouts or creation with Herdr's default name
[[keys.command]]
key = "alt+i"
type = "popup"
command = 'python3 "$HOME/.config/herdr/helpers/herdr_worktrees.py" 1'
description = "open or assign worktree slot 1"
width = "80%"
height = "60%"

[[keys.command]]
key = "alt+o"
type = "popup"
command = 'python3 "$HOME/.config/herdr/helpers/herdr_worktrees.py" 2'
description = "open or assign worktree slot 2"
width = "80%"
height = "60%"

[[keys.command]]
key = "alt+p"
type = "popup"
command = 'python3 "$HOME/.config/herdr/helpers/herdr_worktrees.py" 3'
description = "open or assign worktree slot 3"
width = "80%"
height = "60%"

# Bind Prefix + c to create a tab in the lowest free slot
[[keys.command]]
key = "prefix+c"
type = "shell"
command = 'python3 "$HOME/.config/herdr/helpers/herdr.py" new-tab'
description = "create tab in first free slot"

# Bind Prefix + < and > to move or swap the current tab by slot
[[keys.command]]
key = "prefix+<"
type = "shell"
command = 'python3 "$HOME/.config/herdr/helpers/herdr.py" move-tab left'
description = "move tab one slot left"

[[keys.command]]
key = "prefix+>"
type = "shell"
command = 'python3 "$HOME/.config/herdr/helpers/herdr.py" move-tab right'
description = "move tab one slot right"

