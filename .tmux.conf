# Escape Time => 0
set -s escape-time 0

# Change prefix from C-b to C-a 
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload tmux file using Prefix + r
bind r source-file ~/.tmux.conf

# Set the base index for windows to 1 instead of 0
set -g base-index 1

# Vim bindings
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Disabling confirmation when closing windows/panes
bind-key x kill-pane
bind-key & kill-window

# Enable RGB colour if running in xterm(1)
set-option -sa terminal-overrides ",xterm*:Tc"

# Enable image rendering for yazi
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Enable extended keys
set -g extended-keys on
set -g extended-keys-format csi-u

# Enable mouse mode
set -g mouse on

# Cursor style
set -g cursor-style "blinking-bar"

# Bind Alt + q, w, e, r, t to switch to windows 1, 2, 3, 4, 5 creating them if they don't exist
bind -n M-q run-shell 'tmux select-window -t 1 || tmux new-window -t 1'
bind -n M-w run-shell 'tmux select-window -t 2 || tmux new-window -t 2'
bind -n M-e run-shell 'tmux select-window -t 3 || tmux new-window -t 3'
bind -n M-r run-shell 'tmux select-window -t 4 || tmux new-window -t 4'
bind -n M-t run-shell 'tmux select-window -t 5 || tmux new-window -t 5'

# Bind Ctrl + f to open tmux thing (session picker)
bind -n C-f run-shell 'tmux neww zsh -ic "tmuxthing"'

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
# bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
# bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
# bind-key -T copy-mode-vi 'C-j' select-pane -D
# bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Alt + 1–6: pass through to Neovim, otherwise switch tmux pane
bind-key -n M-1 if-shell "$is_vim" 'send-keys M-1' 'select-pane -t 0'
bind-key -n M-2 if-shell "$is_vim" 'send-keys M-2' 'select-pane -t 1'
bind-key -n M-3 if-shell "$is_vim" 'send-keys M-3' 'select-pane -t 2'
bind-key -n M-4 if-shell "$is_vim" 'send-keys M-4' 'select-pane -t 3'
bind-key -n M-5 if-shell "$is_vim" 'send-keys M-5' 'select-pane -t 4'
bind-key -n M-6 if-shell "$is_vim" 'send-keys M-6' 'select-pane -t 5'
